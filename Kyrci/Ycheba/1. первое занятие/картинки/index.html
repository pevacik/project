<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание №1. Галлерея картинок</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="gallery">
        <div class="container indent">
            <div class="gallery_content">

                <div class="gallery_main_img">
                    <img src="img/image-1.jpg">
                </div>
                <div class="gallery_items ">
                    <div class="gallery_item active ">
                        <img src="img/image-1.jpg" data-src="img/image-1.jpg">
                    </div>
                    <div class="gallery_item ">
                        <img src="img/image-2.jpg" data-src="img/image-2.jpg">
                    </div>
                    <div class="gallery_item ">
                        <img src="img/image-3.jpg" data-src="img/image-3.jpg">
                    </div>
                    <div class="gallery_item">
                        <img src="img/image-4.jpg" data-src="img/image-4.jpg">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
