<!DOCTYPE html>
<html>

<head>
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Мои проекты</h1>
    <div class="container">
        <h3>Туду лист</h3>
        <h2>Мои задачи</h2>
        <input type="text" id="taskInput" placeholder="Введите задачу...">
        <button id="addButton">Добавить</button>
        <ul id="taskList"></ul>
    </div>
    <div class="calculator container">
        <h2>Калькулятор</h2>
        <input type="text" class="calculator-input" id="WorkAreaCalculator">
        <div>
            <button class="calculator-batton" onclick="handleOperation('+')"> +</button>
            <button class="calculator-batton" onclick="handleOperation('-')"> -</button>
            <button class="calculator-batton" onclick="handleOperation('*')"> *</button>
            <button class="calculator-batton" onclick="handleOperation('/')"> :</button>
            <button class="calculator-batton" onclick="EqualsRun()" id="EqualsBtn">= </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
