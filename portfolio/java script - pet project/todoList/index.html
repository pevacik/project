<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Список Задач</title>
</head>

<body>
    <h1>Список Задач</h1>
    <div class="todo-input-container">
        <input type="text" class="todo-input">
        <input type="date" class="todo-date">
        <button class="todo-add-button button">Добавить</button>
    </div>
    <div class="todo-container">
        <ul class="todo-list">
            <li class="todo-item">
                <h2>Задача</h2>
                <button class="todo-delete-button button">Удалить</button>
                <button class="todo-complete-button button">Выполнить</button>
                <button class="todo-edit-button button">Изменить</button>
            </li>
        </ul>
        <ul class="todo-list-done">
            <li class="todo-list-done_item">

            </li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
